<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1400" viewBox="0 0 1800 1400" role="img" aria-labelledby="title desc">
  <title id="title">Місця спостереження у виконанні одного агента</title>
  <desc id="desc">Модель запитує операцію. Застосунок перевіряє запит. Відхилений запит не виконується; дозволений запит переходить до виклику та фактичного повернення. Застосунок допускає свідчення та передає обмежений запит до моделі. Модель використовує передану інформацію й обирає наступну дію або зупинку. Наступна дія повертає до межі запиту. Повернуту відповідь окремо оцінює оцінювач-людина; це оцінювання не є частиною циклу зворотного зв’язку вибору дій.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10Z" fill="#35465f" />
    </marker>
  </defs>
  <style>text{font-family:Arial,sans-serif;fill:#172b43;font-size:25px}.heading{font-size:34px;font-weight:700}.step{font-size:28px;font-weight:700}.small{font-size:22px}.box{fill:#eef5fb;stroke:#54728f;stroke-width:2}.link{fill:none;stroke:#35465f;stroke-width:3;marker-end:url(#arrow)}</style>
  <rect width="1800.0" height="1380.0" fill="white" />
  <text x="120.0" y="63.25" class="heading">Перевіряти перебіг роботи, а не лише остаточну відповідь</text>
  <rect x="144.0" y="120.75" width="966.0" height="161.0" rx="18.0" class="box" />
  <text x="180.0" y="166.75" class="step">1. Запитувана дія та вхід</text>
  <text x="180.0" y="212.75">Модель обирає <tspan font-weight="700">інструмент</tspan> і вхід, пов’язаний із завданням.</text>
  <text x="180.0" y="253.0">Перевірити запит відносно оголошеного інтерфейсу.</text>
  <path d="M 626.4 281.75 V 345.0" class="link" />
  <rect x="144.0" y="345.0" width="966.0" height="161.0" rx="18.0" class="box" />
  <text x="180.0" y="391.0" class="step">2. Перевірки дозволу та запиту</text>
  <text x="180.0" y="437.0">Застосунок перевіряє доступність і дозволену область.</text>
  <text x="180.0" y="477.25">Запит не є свідченням виконання.</text>
  <path d="M 1110.0 425.5 H 1248.0" class="link" />
  <text x="1134.0" y="402.5" class="small">відхилено</text>
  <rect x="1248.0" y="350.75" width="450.0" height="207.0" rx="18.0" fill="#fff2e9" stroke="#b66b3e" stroke-width="2" />
  <text x="1278.0" y="396.75" class="step">Без виклику</text>
  <text x="1278.0" y="437.0">Зберегти відхилення та</text>
  <text x="1278.0" y="474.95">фактичний результат запуску.</text>
  <text x="1278.0" y="520.95" class="small">Не виконаний запис.</text>
  <path d="M 626.4 506.0 V 586.5" class="link" />
  <text x="654.0" y="557.75" class="small">дозволено</text>
  <rect x="144.0" y="586.5" width="966.0" height="161.0" rx="18.0" class="box" />
  <text x="180.0" y="632.5" class="step">3. Виконаний вхід і фактичне повернення</text>
  <text x="180.0" y="678.5">Застосунок викликає операцію та зберігає її повернення.</text>
  <text x="180.0" y="718.75">Завершений виклик не доводить правильності вмісту.</text>
  <path d="M 626.4 747.5 V 816.5" class="link" />
  <rect x="144.0" y="816.5" width="966.0" height="161.0" rx="18.0" class="box" />
  <text x="180.0" y="862.5" class="step">4. Допуск і переданий вхід моделі</text>
  <text x="180.0" y="908.5">Застосунок виконує <tspan font-weight="700">відбір одиниць інформаційного пошуку</tspan>.</text>
  <text x="180.0" y="948.75">До наступного запиту моделі входять лише допущені свідчення.</text>
  <path d="M 626.4 977.5 V 1046.5" class="link" />
  <rect x="144.0" y="1046.5" width="966.0" height="172.5" rx="18.0" class="box" />
  <text x="180.0" y="1092.5" class="step">5. Використання переданої інформації та наступний вибір</text>
  <text x="180.0" y="1138.5">Модель обирає іншу дію або пропонує зупинитися.</text>
  <text x="180.0" y="1178.75">Перевірити вибір відносно завдання й фактичного результату.</text>
  <path d="M 144.0 1138.5 H 66.0 V 201.25 H 144.0" class="link" />
  <text x="42.0" y="810.75" transform="rotate(-90 42 810.75)" class="small">запит наступної дії</text>
  <path d="M 1110.0 1132.75 H 1248.0" class="link" stroke-dasharray="8 6" />
  <text x="1134.0" y="1000.5" class="small">повернута</text>
  <text x="1134.0" y="1032.7" class="small">відповідь</text>
  <rect x="1248.0" y="1046.5" width="450.0" height="201.25" rx="18.0" fill="#edf8f1" stroke="#52755c" stroke-width="2" />
  <text x="1278.0" y="1092.5" class="step">Окреме оцінювання</text>
  <text x="1278.0" y="1136.2">
    <tspan font-weight="700">Оцінювач-людина</tspan>
  </text>
  <text x="1278.0" y="1176.45">застосовує <tspan font-weight="700">рубрику оцінювання</tspan>.</text>
  <text x="1278.0" y="1216.7" class="small">Без передавання повноважень.</text>
  <text x="144.0" y="1305.25" class="small">Ілюстративна гілка читання; історія ходу завдання не обходить допуск свідчень.</text>
  <text x="144.0" y="1345.5" class="small">Результати без виходу зберігаються; зупинка не встановлює виконання завдання.</text>
</svg>
